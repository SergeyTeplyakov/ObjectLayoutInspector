name: Pull Request

on:
  pull_request:
    branches: [ master ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    - name: Install dependencies
      run: dotnet restore src/ObjectLayoutInspector.slnx
    - name: Build
      run: dotnet build src/ObjectLayoutInspector.slnx --no-restore
    - name: Test (.NET Core)
      if: runner.os == 'Linux'
      run: dotnet test src/ObjectLayoutInspector.Tests/ObjectLayoutInspector.Tests.csproj --no-restore -f net10.0 && dotnet test src/ObjectLayoutInspector.Tests/ObjectLayoutInspector.Tests.csproj --no-restore -f net8.0
    - name: Test (all frameworks)
      if: runner.os == 'Windows'
      run: dotnet test src/ObjectLayoutInspector.Tests/ObjectLayoutInspector.Tests.csproj --no-restore
