name: Pull Request

on:
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Install dependencies
      run: dotnet restore src/ObjectLayoutInspector.slnx
    - name: Build
      run: dotnet build src/ObjectLayoutInspector.slnx --no-restore
    - name: Test
      run: dotnet test src/ObjectLayoutInspector.slnx --no-restore
